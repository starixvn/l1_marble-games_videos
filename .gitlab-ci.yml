stages:
  - deploy
  - clean

default:
  tags:
    - k8s

variables:
  UPLOAD_VIDEO_IMAGE: hub.lumigame.com/pentagon-base/tool-s3:1.0

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      for path in $fileserver_path/*; do
        if [ -d "$path" ] && [ "$path" != "$fileserver_path/archived" ]; then
          theme=$(basename "$path")
          echo "Syncing $theme"
          
          existing_files=$(s3cmd -c $s3cfg ls s3://$BUCKET/$theme/ | awk '{print $4}' | sed "s|s3://$BUCKET/$theme/||" | grep -v '/$')
          echo "DEBUG: existing_files content:"
          echo "$existing_files"

          echo "Putting encryption.key"
          s3cmd -c $s3cfg put keys/encryption.key "s3://$BUCKET/$theme/encryption.key"

          find $fileserver_path/$theme -type f | while read file; do
            filename=$(basename "$file")

            echo "DEBUG: Checking filename: $filename"

            if echo "$existing_files" | grep -Fxq -- "^$filename$"; then
              echo "DEBUG: File $filename already exists, skipping"
              continue
            fi

            s3cmd -c $s3cfg put "$file" "s3://$BUCKET/$theme/$filename"
          done
        fi
      done
  when: manual

sync_local:
  extends: .sync
  variables:
    ENVIRONMENT: local
    BUCKET: scstream

sync_prod:
  extends: .sync
  variables:
    ENVIRONMENT: prod
    BUCKET: vnteam-sc-stream-prod
