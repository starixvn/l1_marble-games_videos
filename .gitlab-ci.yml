stages:
  - deploy
  - clean

default:
  tags:
    - k8s

variables:
  UPLOAD_VIDEO_IMAGE: hub.lumigame.com/pentagon-base/tool-s3:1.0

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      uploaded=uploaded.txt
      for path in $fileserver_path/*; do
        if [ -d "$path" ] && [ "$path" != "$fileserver_path/archived" ]; then
          theme=$(basename "$path")
          total_files=$(find $fileserver_path/$theme -type f | wc -l)
          count=0
          skipped=0
          
          (s3cmd -c $s3cfg ls s3://$BUCKET/$theme/ | awk '{print $4}' | sed "s|s3://$BUCKET/$theme/||" | grep -v '/$') > $uploaded

          echo "[$theme] Putting encryption.key"
          s3cmd -c $s3cfg put --quiet keys/encryption.key "s3://$BUCKET/$theme/encryption.key"

          find $fileserver_path/$theme -type f | while read file; do
            filename=$(basename "$file")

            if grep -Fxq -- "$filename" "$uploaded"; then
              skipped=$((skipped + 1))
              continue
            fi

            s3cmd -c $s3cfg put --quiet "$file" "s3://$BUCKET/$theme/$filename"

            count=$((count + 1))
            echo $filename >> $theme.txt
            echo "[$theme] Synced $count/$total_files files, skipped $skipped files"
          done

          echo "[$theme] Synced $count/$total_files files, skipped $skipped files"
        fi
      done
  when: manual
  artifacts:
    paths:
      - "*.txt"
    expire_in: 1 day

sync_local:
  extends: .sync
  variables:
    ENVIRONMENT: local
    BUCKET: scstream

sync_prod:
  extends: .sync
  variables:
    ENVIRONMENT: prod
    BUCKET: vnteam-sc-stream-prod
