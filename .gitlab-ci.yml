include:
  - local: themes.yml

stages:
  - deploy
  - local
  - prod
  - clean

default:
  tags:
    - k8s

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
    FIND_OPTIONS: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      uploaded=uploaded.txt
      theme=$THEME
      total_files=$(find $fileserver_path/$THEME$DIRECTORY -type f $FIND_OPTIONS | wc -l)
      count=0
      skipped=0

      echo "[$THEME] Putting encryption.key"
      s3cmd -c $s3cfg put --quiet keys/encryption.key "s3://$BUCKET/$THEME/encryption.key"
      s3cmd -c $s3cfg put --quiet configs/config_voice.json "s3://$BUCKET/$THEME/config_voice.json"

      echo "[$THEME] Getting existing files"
      (s3cmd -c $s3cfg ls s3://$BUCKET/$THEME/ | awk '{print $4}' | sed "s|s3://$BUCKET/$THEME/||" | grep -v '/$') > $uploaded

      find $fileserver_path/$THEME$DIRECTORY -type f $FIND_OPTIONS | while read file; do
        filename=$(basename "$file")

        if grep -Fxq -- "$filename" "$uploaded"; then
          skipped=$((skipped + 1))

          echo "[$THEME] Synced $count/$((total_files - skipped)) files, skipped $skipped files"
          continue
        fi

        s3cmd -c $s3cfg put --quiet "$file" "s3://$BUCKET/$THEME/$filename"

        count=$((count + 1))
        echo "[$THEME] Synced $count/$((total_files - skipped)) files, skipped $skipped files"
      done
  when: manual
  only:
    - main
    - develop

.rm:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
    FIND_OPTIONS: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      s3cmd -c $s3cfg del -r "s3://$BUCKET/$THEME"
  when: manual
  only:
    - main
    - develop

.local:
  stage: local
  variables:
    ENVIRONMENT: local
    BUCKET: scstream

.prod:
  stage: prod
  variables:
    ENVIRONMENT: prod
    BUCKET: vnteam-sc-stream-prod

sync_base_local:
  extends:
    - .sync
    - .local
    - .theme_base

sync_base_prod:
  extends:
    - .sync
    - .prod
    - .theme_base

sync_epl_local:
  extends:
    - .sync
    - .local
    - .theme_epl

sync_epl_prod:
  extends:
    - .sync
    - .prod
    - .theme_epl

sync_ucl_local:
  extends:
    - .sync
    - .local
    - .theme_ucl

sync_ucl_prod:
  extends:
    - .sync
    - .prod
    - .theme_ucl

sync_soccer_pingoal_local:
  extends:
    - .sync
    - .local
    - .theme_soccer_pingoal

sync_soccer_pingoal_prod:
  extends:
    - .sync
    - .prod
    - .theme_soccer_pingoal

sync_ultra_live_local:
  extends:
    - .sync
    - .local
    - .theme_ultra_live

sync_ultra_live_prod:
  extends:
    - .sync
    - .prod
    - .theme_ultra_live

rm_ultra_live_local:
  extends:
    - .rm
    - .local
    - .theme_ultra_live
