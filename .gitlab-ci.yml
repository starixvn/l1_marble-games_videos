stages:
  - deploy
  - clean

default:
  tags:
    - k8s

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      uploaded=uploaded.txt
      theme=$THEME
      total_files=$(find $fileserver_path/$THEME -type f | wc -l)
      count=0
      skipped=0

      echo "[$THEME] Putting encryption.key"
      s3cmd -c $s3cfg put --quiet keys/encryption.key "s3://$BUCKET/$THEME/encryption.key"
      s3cmd -c $s3cfg put --quiet configs/config_voice.json "s3://$BUCKET/$THEME/config_voice.json"

      echo "[$THEME] Getting existing files"
      (s3cmd -c $s3cfg ls s3://$BUCKET/$THEME/ | awk '{print $4}' | sed "s|s3://$BUCKET/$THEME/||" | grep -v '/$') > $uploaded

      find $fileserver_path/$THEME -type f | while read file; do
        filename=$(basename "$file")

        if grep -Fxq -- "$filename" "$uploaded"; then
          skipped=$((skipped + 1))

          echo "[$THEME] Synced $count/$((total_files - skipped)) files, skipped $skipped files"
          continue
        fi

        s3cmd -c $s3cfg put --quiet "$file" "s3://$BUCKET/$THEME$DIRECTORY/$filename"

        count=$((count + 1))
        echo "[$THEME] Synced $count/$((total_files - skipped)) files, skipped $skipped files"
      done
  when: manual
  only:
    - main

sync_base:
  extends: .sync
  parallel:
    matrix:
      - ENVIRONMENT: local
        BUCKET: scstream
        THEME:
          - 2001
          - galaxy
          - youtube
          - marble_tv
      - ENVIRONMENT: prod
        BUCKET: vnteam-sc-stream-prod
        THEME:
          - 2001
          - galaxy
          - youtube
          - marble_tv

