include:
  - local: themes.yml

stages:
  - build
  - test
  - deploy
  - local
  - prod
  - clean

variables:
  THEME: test

default:
  tags:
    - k8s

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd@sha256:590c42746db1252be8aad33e287c7910698c32b58b4fc34f67592a5bd0841551
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
    FIND_OPTIONS: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      uploaded=uploaded.txt
      theme=$THEME
      PARALLEL_JOBS=${PARALLEL_JOBS:-6}

      echo "[$THEME] Putting encryption.key and config"
      s3cmd -c $s3cfg put --quiet keys/encryption.key "s3://$BUCKET/$THEME/encryption.key"
      s3cmd -c $s3cfg put --quiet configs/config_voice.json "s3://$BUCKET/$THEME/config_voice.json"

      echo "[$THEME] Getting existing files"
      s3cmd -c $s3cfg ls "s3://$BUCKET/$THEME/" | awk '{print $4}' | sed "s|s3://$BUCKET/$THEME/||" | grep -v '/$' > $uploaded

      # Create temp files for processing
      files_to_upload=$(mktemp)
      upload_script=$(mktemp)

      echo "[$THEME] Scanning files..."
      skipped=0
      find $fileserver_path/$THEME$DIRECTORY -type f $FIND_OPTIONS | while read file; do
        filename=$(basename "$file")
        
        if grep -Fxq -- "$filename" "$uploaded"; then
          skipped=$((skipped + 1))
        else
          echo "$file" >> $files_to_upload
        fi
      done

      total_files=$(wc -l < $files_to_upload | tr -d ' ')
      echo "[$THEME] Found $total_files files to upload"

      if [ "$total_files" -eq 0 ]; then
        echo "[$THEME] Nothing to upload"
        exit 0
      fi

      # Create inline upload script with status output
      cat > $upload_script << 'SCRIPT_EOF'
      file="$1"
      filename=$(basename "$file")
      if s3cmd -c "$S3CFG" put --quiet "$file" "s3://$BUCKET/$THEME/$filename" 2>&1; then
        echo "OK|$filename"
      else
        echo "FAIL|$filename"
      fi
      SCRIPT_EOF

      chmod +x $upload_script

      # Export variables for subprocesses
      export S3CFG=$s3cfg
      export BUCKET
      export THEME

      echo "[$THEME] Starting upload with $PARALLEL_JOBS workers..."

      # Parallel upload with progress counter
      cat $files_to_upload | xargs -P $PARALLEL_JOBS -I {} sh $upload_script {} | \
      awk -F'|' -v theme="$THEME" -v total="$total_files" '
      {
        count++
        filename = $2
        printf "[%s] Uploaded %d/%d files: %s\r", theme, count, total, filename
        fflush()
      }
      END {
        printf "[%s] Upload complete! %d/%d files uploaded\n", theme, count, total
      }
      '
  when: manual
  only:
    - main
    - develop

.rm_s3:
  stage: clean
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd@sha256:590c42746db1252be8aad33e287c7910698c32b58b4fc34f67592a5bd0841551
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      s3cmd -c $s3cfg del -r "s3://$BUCKET/$THEME"
  when: manual
  only:
    - main
    - develop

.rm_fileserver:
  stage: clean
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd@sha256:590c42746db1252be8aad33e287c7910698c32b58b4fc34f67592a5bd0841551
    entrypoint: ["/bin/sh"]
  variables:
    THEME: $THEME
    DIRECTORY: ""
  script:
    - |
      TARGET_DIR="/paradigm/$THEME$DIRECTORY"
      FILE_COUNT=$(find "$TARGET_DIR" -type f | wc -l)

      echo "Total files found: $FILE_COUNT"
      find $TARGET_DIR -type f | while read file; do
        rm $file
        echo $file
      done

      rm -r "$TARGET_DIR"/*
      echo "Cleanup complete."
  when: manual
  only:
    - main
    - develop

.ffmpeg:
  stage: build
  tags:
    - render
  variables:
    THEME: $THEME
  before_script:
    - net use \\ds925p.nexdev.net\paradigm\deployments /user:LUMINET\gitlab.runner $FILESERVER_PASSWORD
  after_script: []
  script:
    - node ./scripts/ffmpeg.js $THEME
  when: manual
  only:
    - main
    - develop

.local:
  stage: local
  variables:
    ENVIRONMENT: local
    BUCKET: scstream

.prod:
  stage: prod
  variables:
    ENVIRONMENT: prod
    BUCKET: vnteam-sc-stream-prod

