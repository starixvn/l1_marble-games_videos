stages:
  - deploy
  - clean

default:
  tags:
    - k8s

variables:
  UPLOAD_VIDEO_IMAGE: hub.lumigame.com/pentagon-base/tool-s3:1.0

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=5tgb^YHN7ujm,domain=LUMINET

after_script:
  - umount /paradigm

sync:
  stage: deploy
  image:
    name: d3fk/s3cmd
    entrypoint: ["/bin/sh"]
  script:
    - theme=2002
    - environment=local
    - s3cfg=configs/$environment.s3cfg
    - |
      existing_files=$(s3cmd -c $s3cfg ls s3://scstream/$theme/ | awk '{print $4}' | sed "s|s3://scstream/$theme/||")
      find /paradigm/$theme -type f | while read file; do
          filename=$(basename "$file")

          if echo "$existing_files" | grep -q "^$filename$"; then
              continue
          fi

          s3cmd -c $s3cfg put "$file" "s3://scstream/$theme/$filename"
      done
  when: manual
