include:
  - local: themes.yml

stages:
  - deploy
  - local
  - prod
  - clean

default:
  tags:
    - k8s

before_script:
  - mkdir -p /paradigm
  - mount -t cifs //ds925p.nexdev.net/paradigm/deployments /paradigm -o username=gitlab.runner,password=$FILESERVER_PASSWORD,domain=LUMINET

after_script:
  - umount /paradigm

.sync:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd@sha256:4252b3d04c18dc7fec2117259ab5dc0e51cb46b8719e661762222b44f6559189
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
    FIND_OPTIONS: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      fileserver_path=/paradigm
      uploaded=uploaded.txt
      theme=$THEME
      PARALLEL_JOBS=${PARALLEL_JOBS:-10}

      echo "[$THEME] Putting encryption.key and config"
      s3cmd -c $s3cfg put --quiet keys/encryption.key "s3://$BUCKET/$THEME/encryption.key"
      s3cmd -c $s3cfg put --quiet configs/config_voice.json "s3://$BUCKET/$THEME/config_voice.json"

      echo "[$THEME] Getting existing files"
      s3cmd -c $s3cfg ls "s3://$BUCKET/$THEME/" | awk '{print $4}' | sed "s|s3://$BUCKET/$THEME/||" | grep -v '/$' > $uploaded

      # Create temp files for processing
      files_to_upload=$(mktemp)
      upload_script=$(mktemp)

      echo "[$THEME] Scanning files..."
      find $fileserver_path/$THEME$DIRECTORY -type f $FIND_OPTIONS | while read file; do
        filename=$(basename "$file")
        
        if grep -Fxq -- "$filename" "$uploaded"; then
          : # skip
        else
          echo "$file" >> $files_to_upload
        fi
      done

      total_files=$(wc -l < $files_to_upload)
      echo "[$THEME] Found $total_files files to upload"

      # Create inline upload script (no need for function export)
      cat > $upload_script << 'SCRIPT_EOF'
      file="$1"
      filename=$(basename "$file")
      s3cmd -c "$S3CFG" put --quiet "$file" "s3://$BUCKET/$THEME/$filename" 2>&1 && echo "[$THEME] Uploaded: $filename"
      SCRIPT_EOF

      chmod +x $upload_script

      # Export variables for subprocesses
      export S3CFG=$s3cfg
      export BUCKET
      export THEME

      # Parallel upload using xargs
      cat $files_to_upload | xargs -P $PARALLEL_JOBS -I {} sh $upload_script {}

      # Cleanup
      rm -f $files_to_upload $upload_script

      echo "[$THEME] Upload complete!"
  when: manual
  only:
    - main
    - develop

.rm:
  stage: deploy
  image:
    name: hub.lumigame.com/docker-hub/d3fk/s3cmd@sha256:4252b3d04c18dc7fec2117259ab5dc0e51cb46b8719e661762222b44f6559189
    entrypoint: ["/bin/sh"]
  variables:
    ENVIRONMENT: $ENVIRONMENT
    BUCKET: $BUCKET
    THEME: $THEME
    DIRECTORY: ""
    FIND_OPTIONS: ""
  script:
    - |
      s3cfg=configs/$ENVIRONMENT.s3cfg
      s3cmd -c $s3cfg del -r "s3://$BUCKET/$THEME"
  when: manual
  only:
    - main
    - develop

.local:
  stage: local
  variables:
    ENVIRONMENT: local
    BUCKET: scstream

.prod:
  stage: prod
  variables:
    ENVIRONMENT: prod
    BUCKET: vnteam-sc-stream-prod

