.theme_base: &theme_base
  - 2001
  - galaxy
  - youtube
  - marble_tv

.theme_base_local:
  stage: local
  parallel:
    matrix:
      - ENVIRONMENT: local
        BUCKET: scstream
        THEME: *theme_base

.theme_base_prod:
  stage: prod
  parallel:
    matrix:
      - ENVIRONMENT: prod
        BUCKET: vnteam-sc-stream-prod
        THEME: *theme_base

